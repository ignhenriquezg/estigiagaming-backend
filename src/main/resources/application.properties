spring.application.name=estigiagaming-backend
server.port=8080

# Conexion a MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/estigiagaming_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
